<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>audio-context E2E fixture</title>
  </head>
  <body>
    <audio-context id="audio">
      <audio-input-mic id="mic">
        <audio-biquad-filter id="mix" frequency="1200">
          <audio-output id="output"></audio-output>
          <audio-stream-output id="recording-output">
            <media-recorder id="recorder"></media-recorder>
          </audio-stream-output>
        </audio-biquad-filter>
      </audio-input-mic>
      <audio-input-file
        id="music"
        src="/tests/e2e/fixtures/tone.wav"
        to="mix"
        loop
      ></audio-input-file>
    </audio-context>
    <div id="invalid-host"></div>

    <script type="module">
      import "/src/audio/index.js";

      const context = document.querySelector("#audio");
      const mic = document.querySelector("#mic");
      const file = document.querySelector("#music");
      const recorder = document.querySelector("#recorder");
      const events = [];
      const recordedChunks = [];
      let micStream = null;
      const micStreams = [];

      const record = (node) => (event) => {
        const data = event.detail.data;
        if (data instanceof MediaStream) {
          micStream = data;
          micStreams.push(data);
        }
        const eventStream = data?.stream instanceof MediaStream ? data.stream : null;
        events.push({
          node,
          type: event.type,
          dataKind: data?.constructor?.name ?? typeof data,
          metadata: event.detail.metadata,
          contextState: context.state,
          trackStates:
            data instanceof MediaStream || eventStream
              ? (eventStream ?? data).getTracks().map(({ enabled, readyState }) => ({
                  enabled,
                  readyState,
                }))
              : null,
          previousDeviceId: data?.previousDeviceId ?? null,
          deviceId: data?.deviceId ?? null,
        });
      };

      for (const type of ["statechange", "sinkchange", "error"]) {
        context.addEventListener(type, record("audio"));
      }
      for (const type of ["open", "close", "devicechange", "error"]) {
        mic.addEventListener(type, record("mic"));
      }
      for (const type of ["play", "playing", "pause", "ended", "error"]) {
        file.addEventListener(type, record("music"));
      }
      for (const type of ["start", "dataavailable", "pause", "resume", "stop", "error"]) {
        recorder.addEventListener(type, (event) => {
          if (type === "dataavailable" && event.detail.data.size > 0) {
            recordedChunks.push(event.detail.data);
          }
          record("recorder")(event);
        });
      }

      const trackStates = () =>
        micStream?.getTracks().map(({ enabled, readyState }) => ({
          enabled,
          readyState,
        })) ?? [];

      globalThis.audioFixture = {
        ready: true,
        context,
        mic,
        file,
        recorder,
        events,
        recordedChunks,
        snapshot: () => ({
          connected: context.isConnected,
          contextState: context.state,
          filePaused: file.paused,
          recorderState: recorder.state,
          recordedChunkCount: recordedChunks.length,
          micTracks: trackStates(),
          micStreamHistory: micStreams.map((stream) =>
            stream.getTracks().map(({ enabled, readyState }) => ({
              enabled,
              readyState,
            })),
          ),
          events: structuredClone(events),
        }),
      };
    </script>
  </body>
</html>
